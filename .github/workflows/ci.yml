name: CI

on:
  push:
    branches:
      - main
      - "feat/**"
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Run contract tests
        run: npm test
      - name: Verify deterministic piano bank
        run: |
          node scripts/generate-st-piano-bank.mjs
          git diff --exit-code -- vendor/st-piano
      - name: Check whitespace
        run: git diff --check
  tab-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, webkit]
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Use Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Install browser
        run: npx playwright install --with-deps ${{ matrix.browser }}
      - name: Render pilot TAB at iPhone viewport
        env:
          ST_BROWSER: ${{ matrix.browser }}
        run: npm run test:browser
