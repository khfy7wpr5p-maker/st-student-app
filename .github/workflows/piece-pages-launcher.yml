name: Piece Workspace Temporary Pages Launcher

on:
  push:
    branches:
      - feat/student-06-iphone-voiceover-acceptance

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: piece-workspace-pages-launcher
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: piece-workspace-preview
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout exact Piece preview head
        uses: actions/checkout@v5
        with:
          ref: ff0a0d35768e7926a7979c8134c109ee3dc73388

      - name: Verify exact preview head
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "ff0a0d35768e7926a7979c8134c109ee3dc73388"

      - name: Validate preview fixture syntax
        run: node --check .github/preview/piece-workspace-preview.js

      - name: Prepare bounded UI-only preview
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html service-worker.js _site/
          cp -R src vendor _site/
          cp .github/preview/piece-workspace-preview.js _site/piece-preview.js
          python - <<'PY'
          from pathlib import Path
          index = Path("_site/index.html")
          text = index.read_text()
          old = '<script type="module" src="./src/ui/main.js"></script>'
          new = '<script type="module" src="./piece-preview.js"></script>'
          if old not in text:
              raise SystemExit("preview index bootstrap marker missing")
          index.write_text(text.replace(old, new))

          sw = Path("_site/service-worker.js")
          text = sw.read_text()
          old = '  "./src/ui/main.js",'
          new = '  "./piece-preview.js",'
          if old not in text:
              raise SystemExit("preview service worker bootstrap marker missing")
          sw.write_text(text.replace(old, new))
          PY
          printf '%s\n' "ff0a0d35768e7926a7979c8134c109ee3dc73388" > _site/preview-head.txt
          touch _site/.nojekyll

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload preview artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: piece-workspace-launcher-${{ github.run_id }}
          path: _site

      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: piece-workspace-launcher-${{ github.run_id }}
