<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ST Student</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: light dark;

        --st-space-1: 0.25rem;
        --st-space-2: 0.5rem;
        --st-space-3: 0.75rem;
        --st-space-4: 1rem;
        --st-space-6: 1.5rem;
        --st-space-8: 2rem;

        --st-radius-sm: 0.5rem;
        --st-radius-md: 0.75rem;
        --st-radius-lg: 1rem;

        --st-font-size-sm: 0.875rem;
        --st-font-size-md: 1rem;
        --st-font-size-lg: 1.25rem;
        --st-font-size-xl: clamp(1.5rem, 3vw, 2rem);

        --st-surface-page: Canvas;
        --st-surface-panel: color-mix(in srgb, Canvas 96%, CanvasText 4%);
        --st-surface-raised: color-mix(in srgb, Canvas 98%, CanvasText 2%);
        --st-border: color-mix(in srgb, CanvasText 18%, transparent);
        --st-text-muted: color-mix(in srgb, CanvasText 70%, transparent);
        --st-focus-ring: 0.2rem solid currentColor;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        background: var(--st-surface-page);
        color: CanvasText;
        font-size: var(--st-font-size-md);
        line-height: 1.5;
      }

      h1,
      h2,
      p {
        margin-block: 0;
      }

      h1 {
        font-size: var(--st-font-size-xl);
        line-height: 1.2;
      }

      h2 {
        font-size: var(--st-font-size-lg);
        line-height: 1.3;
      }

      #app {
        box-sizing: border-box;
        width: min(100%, 44rem);
        margin: 0 auto;
        padding: var(--st-space-6);
      }

      #app:has(.student-shell) {
        width: min(100%, 80rem);
      }

      .student-shell {
        display: grid;
        grid-template-columns: minmax(12rem, 25%) minmax(0, 1fr);
        gap: var(--st-space-6);
        align-items: start;
      }

      .student-navigation {
        background: var(--st-surface-panel);
        border: 1px solid var(--st-border);
        border-radius: var(--st-radius-lg);
        padding: var(--st-space-3);
      }

      .student-navigation nav {
        display: grid;
        gap: var(--st-space-2);
        position: sticky;
        top: var(--st-space-4);
      }

      .student-navigation button {
        width: 100%;
      }

      .student-navigation button,
      .work-folders button {
        overflow-wrap: anywhere;
        white-space: normal;
      }

      .student-navigation button[aria-current="page"] {
        border-width: 2px;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .student-content {
        min-width: 0;
        background: var(--st-surface-panel);
        border-radius: var(--st-radius-lg);
        border: 1px solid var(--st-border);
        padding: var(--st-space-6);
      }

      .student-app section,
      .student-app nav,
      .work-list {
        display: grid;
        gap: var(--st-space-4);
      }

      .work-list,
      .pool-list,
      .assignment-list {
        padding: 0;
        margin: 0;
        list-style: none;
      }

      .pool-list,
      .assignment-list {
        display: grid;
        gap: var(--st-space-3);
      }

      .pool-list {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      }

      .work-folders {
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: var(--st-space-2);
      }

      .work-folders button {
        min-width: 0;
      }

      .work-folders button[aria-pressed="true"] {
        border-width: 2px;
        text-decoration: underline;
        text-underline-offset: 0.2em;
      }

      .assignment-list {
        grid-template-columns: repeat(auto-fit, minmax(min(100%, 18rem), 1fr));
      }

      .assignment-card {
        display: grid;
        gap: var(--st-space-3);
        align-content: start;
      }

      .assignment-type,
      .assignment-unavailable {
        color: var(--st-text-muted);
        font-size: var(--st-font-size-sm);
      }

      .teacher-note {
        color: var(--st-text-muted);
        font-size: var(--st-font-size-sm);
      }

      .teacher-note-label {
        display: block;
        color: CanvasText;
        font-weight: 600;
        margin-bottom: var(--st-space-1);
      }

      .pool-card {
        width: 100%;
        display: grid;
        gap: var(--st-space-2);
        text-align: start;
        border: 1px solid var(--st-border);
        background: var(--st-surface-raised);
        padding: var(--st-space-4);
        align-content: start;
      }

      .pool-card-title {
        font-size: var(--st-font-size-lg);
        line-height: 1.3;
      }

      .pool-card-description {
        color: var(--st-text-muted);
        font-weight: 400;
      }

      .pool-published-at,
      .pool-detail-published-at {
        font-size: var(--st-font-size-sm);
        color: var(--st-text-muted);
      }

      .pool-detail {
        display: grid;
        gap: var(--st-space-3);
      }

      .pool-detail,
      .assignment-list article,
      .work-list li {
        border: 1px solid var(--st-border);
        border-radius: var(--st-radius-md);
        background: var(--st-surface-raised);
        padding: var(--st-space-4);
      }

      .work-list li {
        display: grid;
        gap: var(--st-space-3);
      }

      .practice-workspace,
      .practice-notation {
        min-width: 0;
      }

      .practice-workspace > section {
        background: var(--st-surface-raised);
        border: 1px solid var(--st-border);
        border-radius: var(--st-radius-md);
        padding: var(--st-space-4);
      }

      .practice-notation {
        border-width: 2px;
        padding: var(--st-space-6);
      }

      .practice-notation #st-score-root {
        min-width: 0;
        width: 100%;
        overflow-x: auto;
      }

      .practice-playback {
        background: var(--st-surface-panel);
      }

      .practice-playback-controls {
        display: flex;
        flex-wrap: wrap;
        gap: var(--st-space-2);
      }

      .practice-tempo {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto;
        gap: var(--st-space-2);
        align-items: end;
      }

      .practice-tempo label {
        grid-column: 1 / -1;
      }

      .practice-repeat {
        min-height: 3rem;
        display: flex;
        align-items: center;
        gap: var(--st-space-2);
      }

      .practice-repeat input[type="checkbox"] {
        width: 1.25rem;
        height: 1.25rem;
        min-height: 1.25rem;
        flex: 0 0 auto;
      }

      input {
        min-height: 3rem;
        padding: var(--st-space-3);
        border: 1px solid var(--st-border);
        border-radius: var(--st-radius-md);
        background: var(--st-surface-raised);
        color: inherit;
        font: inherit;
      }

      button {
        min-height: 3rem;
        padding: var(--st-space-3) var(--st-space-4);
        font: inherit;
        font-weight: 600;
        color: inherit;
        border: 1px solid var(--st-border);
        border-radius: var(--st-radius-md);
        background: var(--st-surface-raised);
        cursor: pointer;
      }

      button:hover {
        background: var(--st-surface-panel);
      }

      button:disabled {
        cursor: default;
        opacity: 0.6;
      }

      button:focus-visible {
        outline: var(--st-focus-ring);
        outline-offset: var(--st-space-1);
      }

      input:focus-visible {
        outline: var(--st-focus-ring);
        outline-offset: var(--st-space-1);
      }

      .app-status {
        width: fit-content;
        max-width: 100%;
        margin-bottom: var(--st-space-3);
        padding: var(--st-space-2) var(--st-space-3);
        border-radius: var(--st-radius-sm);
        background: var(--st-surface-panel);
        border: 1px solid var(--st-border);
        font-size: var(--st-font-size-sm);
      }

      .app-status:empty {
        display: none;
      }

      .offline-availability,
      .practice-playback-quality {
        color: var(--st-text-muted);
        font-size: var(--st-font-size-sm);
      }

      @media (max-width: 640px) {
        #app {
          padding: var(--st-space-4);
        }

        #app:has(.student-shell) {
          padding-top: var(--st-space-2);
          padding-bottom: max(
            var(--st-space-4),
            env(safe-area-inset-bottom, 0px)
          );
          padding-left: max(
            var(--st-space-4),
            env(safe-area-inset-left, 0px)
          );
          padding-right: max(
            var(--st-space-4),
            env(safe-area-inset-right, 0px)
          );
        }

        .student-shell {
          grid-template-columns: 1fr;
          gap: var(--st-space-3);
        }

        .student-navigation {
          position: sticky;
          top: env(safe-area-inset-top, 0px);
          z-index: 10;
          padding: var(--st-space-2);
          border-radius: var(--st-radius-md);
        }

        .student-navigation nav {
          position: static;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          gap: var(--st-space-1);
        }

        .student-navigation button {
          min-width: 0;
          padding-inline: var(--st-space-2);
          font-size: var(--st-font-size-sm);
        }

        .work-folders button {
          min-width: 0;
          padding-inline: var(--st-space-2);
          font-size: var(--st-font-size-sm);
        }

        .student-content {
          padding: var(--st-space-4);
        }

        .practice-notation {
          padding: var(--st-space-3);
        }

        .practice-playback-controls {
          display: grid;
          grid-template-columns: 1fr;
        }

        .practice-tempo {
          grid-template-columns: 1fr;
        }

        .practice-tempo label {
          grid-column: auto;
        }
      }

      @media (max-width: 360px) {
        #app:has(.student-shell) {
          padding-left: max(var(--st-space-2), env(safe-area-inset-left, 0px));
          padding-right: max(var(--st-space-2), env(safe-area-inset-right, 0px));
        }

        .student-content {
          padding: var(--st-space-3);
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="importmap">
    {
      "imports": {
        "@st/score-renderer-contracts": "./vendor/st-score-runtime/modules/contracts.js",
        "@st/score-renderer-core": "./vendor/st-score-runtime/modules/renderer-core.js",
        "@st/score-renderer-osmd": "./vendor/st-score-runtime/modules/adapter-osmd.js",
        "@st/score-renderer-browser-host": "./vendor/st-score-runtime/modules/browser-host.js",
        "opensheetmusicdisplay": "./vendor/st-score-runtime/modules/osmd-module-shim.mjs"
      }
    }
    </script>
    <script type="module" src="./src/ui/main.js"></script>
  </body>
</html>
