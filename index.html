<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ST Student</title>
    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color-scheme: light dark;
      }

      body {
        margin: 0;
        min-height: 100vh;
      }

      #app {
        box-sizing: border-box;
        width: min(100%, 44rem);
        margin: 0 auto;
        padding: 1.5rem;
      }

      #app:has(.student-shell) {
        width: min(100%, 80rem);
      }

      .student-shell {
        display: grid;
        grid-template-columns: minmax(12rem, 25%) minmax(0, 1fr);
        gap: 1.5rem;
        align-items: start;
      }

      .student-navigation nav {
        display: grid;
        gap: 0.75rem;
        position: sticky;
        top: 1rem;
      }

      .student-navigation button {
        width: 100%;
      }

      .student-content {
        min-width: 0;
      }

      .student-app section,
      .student-app nav,
      .work-list {
        display: grid;
        gap: 1rem;
      }

      .work-list,
      .pool-list,
      .assignment-list {
        padding: 0;
        list-style: none;
      }

      .pool-list,
      .assignment-list {
        display: grid;
        gap: 1rem;
      }

      .pool-card {
        width: 100%;
        display: grid;
        gap: 0.5rem;
        text-align: start;
      }

      .work-list li {
        display: grid;
        gap: 0.75rem;
        padding-block: 0.75rem;
      }

      button {
        min-height: 3rem;
        padding: 0.75rem 1rem;
        font: inherit;
      }

      button:focus-visible {
        outline: 0.2rem solid currentColor;
        outline-offset: 0.2rem;
      }

      .app-status:empty {
        display: none;
      }

      @media (max-width: 640px) {
        #app {
          padding: 1rem;
        }

        .student-shell {
          grid-template-columns: 1fr;
        }

        .student-navigation nav {
          position: static;
        }
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="importmap">
    {
      "imports": {
        "@st/score-renderer-contracts": "./vendor/st-score-runtime/modules/contracts.js",
        "@st/score-renderer-core": "./vendor/st-score-runtime/modules/renderer-core.js",
        "@st/score-renderer-osmd": "./vendor/st-score-runtime/modules/adapter-osmd.js",
        "@st/score-renderer-browser-host": "./vendor/st-score-runtime/modules/browser-host.js",
        "opensheetmusicdisplay": "./vendor/st-score-runtime/modules/osmd-module-shim.mjs"
      }
    }
    </script>
    <script type="module" src="./src/ui/main.js"></script>
  </body>
</html>
